name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja capstone cpp-httplib nlohmann-json
      - name: Build app
        run: scripts/build-app.sh --zip --dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg --generate-notes --title "Erebus ${GITHUB_REF_NAME#v}"
