name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja capstone cpp-httplib nlohmann-json
      - name: Build app
        run: scripts/build-app.sh --zip --dmg
      - name: Build the launcher package
        run: scripts/build-package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/*.tar.gz --generate-notes --title "Erebus ${GITHUB_REF_NAME#v}"
          fi
